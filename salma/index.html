<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم سالمة: أدوات درس «خبز ولبن»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#422F0E; --muted:#8A7457; --latte:#F7F1E8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --latte:#EFE6D8; } }
:root[data-theme="dark"]{ --latte:#EFE6D8; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:"Almarai","Tahoma",sans-serif;color:var(--ink);overflow:hidden;
  background:radial-gradient(700px 480px at 92% 8%,#FCEDED,transparent 65%),radial-gradient(640px 460px at 6% 92%,#E6E3F7,transparent 65%),radial-gradient(520px 380px at 50% 110%,#E7F5F9,transparent 70%),var(--latte)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #57B1A8;outline-offset:3px}

/* الرئيسية */
.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:28px}
.home[hidden]{display:none}
.home h1{margin:0;font-size:64px;font-size:clamp(36px,5vw,76px);font-weight:800;line-height:1.15;text-align:center}
.home .sub{margin:0;font-size:24px;font-size:clamp(16px,1.7vw,26px);color:var(--muted);text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;width:min(1500px,100%)}
.card{border:0;border-radius:34px;padding:26px 24px 24px;text-align:start;display:flex;flex-direction:column;gap:10px;min-height:300px;
  box-shadow:0 10px 0 rgba(66,47,14,.08),0 18px 40px rgba(66,47,14,.1);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card:active{transform:translateY(2px)}
.card .num{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-weight:800;font-size:22px}
.card svg{width:96px;height:96px;margin:4px 0}
.card b{font-size:32px;font-size:clamp(22px,2.2vw,36px);font-weight:800;line-height:1.25}
.card span{font-size:18px;font-size:clamp(14px,1.2vw,19px);line-height:1.7;color:rgba(66,47,14,.78)}
.c1{background:#DDF2B8}.c2{background:#AECFD0}.c3{background:#FFD094}.c4{background:#FCC4C0}
.credit{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:rgba(66,47,14,.5)}

/* العرض */
.view{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.view[hidden]{display:none}
nav{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.6);border-bottom:1px solid rgba(66,47,14,.08);flex-wrap:wrap}
nav .home-btn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:#422F0E;color:#fff;min-height:46px;padding:4px 18px;font-size:18px;font-weight:700}
nav .home-btn svg{width:20px;height:20px}
.tabs{display:flex;gap:6px;flex:1 1 auto;justify-content:center;flex-wrap:wrap}
.tab{border:2px solid transparent;border-radius:999px;min-height:46px;padding:4px 20px;font-size:19px;font-weight:800;background:transparent}
.tab[aria-pressed="true"]{border-color:rgba(66,47,14,.18)}
.tab.t1[aria-pressed="true"]{background:#DDF2B8}.tab.t2[aria-pressed="true"]{background:#AECFD0}.tab.t3[aria-pressed="true"]{background:#FFD094}.tab.t4[aria-pressed="true"]{background:#FCC4C0}
.fs{border:0;border-radius:999px;min-height:46px;padding:4px 16px;font-size:17px;font-weight:700;background:#fff}
.frames{position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--latte)}
.frames iframe.on{display:block}
@media (max-width:1000px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .card{min-height:0} .card svg{width:64px;height:64px} }
@media (max-width:560px){ .cards{grid-template-columns:1fr} .home{justify-content:flex-start;overflow:auto} .tab{padding:4px 12px;font-size:16px} }
</style>
</head>

  </div>

</section>

  </nav>

</section>

<script>
(function(){
"use strict";
var TPL=JSON.parse(document.getElementById('tpl').textContent);
var NAMES=['reading','house','kunuz','kitchen'];
var frames=document.getElementById('frames'), ifr=[], cur=-1;
function decode(b64){ var bin=atob(b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }
function open(i){
  if(cur>=0&&ifr[cur]&&ifr[cur].contentWindow){ try{ ifr[cur].contentWindow.postMessage('pause','*'); }catch(e){} }
  if(!ifr[i]){ var f=document.createElement('iframe'); f.title=NAMES[i]; f.setAttribute('allow','fullscreen; autoplay'); f.setAttribute('allowfullscreen',''); f.srcdoc=decode(TPL[NAMES[i]]); frames.appendChild(f); ifr[i]=f; }
  ifr.forEach(function(f,k){ if(f) f.classList.toggle('on',k===i); });
  if(ifr[i].contentWindow){ try{ ifr[i].contentWindow.postMessage('resume','*'); }catch(e){} }
  cur=i;
  document.getElementById('home').hidden=true; document.getElementById('view').hidden=false;
  [].forEach.call(document.querySelectorAll('.tab'),function(t){ t.setAttribute('aria-pressed',+t.dataset.go===i?'true':'false'); });
  setTimeout(function(){ try{ ifr[i].focus(); }catch(e){} },50);
}
[].forEach.call(document.querySelectorAll('[data-go]'),function(b){ b.addEventListener('click',function(){ open(+b.dataset.go); }); });
document.getElementById('toHome').addEventListener('click',function(){
  if(cur>=0&&ifr[cur]){ try{ ifr[cur].contentWindow.postMessage('pause','*'); }catch(e){} }
  document.getElementById('view').hidden=true; document.getElementById('home').hidden=false;
});
var fs=document.getElementById('fs'), root=document.documentElement;
if(document.fullscreenEnabled||document.webkitFullscreenEnabled){ fs.hidden=false; fs.addEventListener('click',function(){ try{ var el=document.fullscreenElement||document.webkitFullscreenElement; if(el)(document.exitFullscreen||document.webkitExitFullscreen).call(document); else (root.requestFullscreen||root.webkitRequestFullscreen).call(root); }catch(e){} }); }
})();
</script>
