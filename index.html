<style>
  html { height: 100%; }
  html, body, #root { min-height: 100%; }

  body {
    font-family: 'Noto Naskh Arabic', system-ui, serif;
    -webkit-font-smoothing: antialiased;
    color: #5B3626;
    position: relative;
  }
  * { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 4px solid #144D4A; outline-offset: 4px; border-radius: 8px; }
  #noscript { padding: 40px 20px; text-align: center; color: #5B3626; font-size: 16px; line-height: 2; }

  /* حبيبات الورق فوق التطبيق كله */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .21  0 0 0 0 .15  0 0 0 .6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: .08;
    mix-blend-mode: multiply;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
