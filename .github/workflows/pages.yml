name: نشر الموقع على GitHub Pages

on:
  push:
    branches:
      - main
      - claude/publish-app-public-2znp10
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تفعيل صفحات GitHub وتهيئتها
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء التطبيق
        run: npm run build

      - name: تجهيز مجلد النشر
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp .nojekyll _site/
          cp assets/app.js assets/styles.css _site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
